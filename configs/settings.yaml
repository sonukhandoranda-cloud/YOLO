database_path: data/attendance/attendance.sqlite3

face:
  camera_index: 0
  match_threshold: 0.41
  min_margin: 0.04
  min_face_size: 80
  vote_window: 8
  vote_required: 5

footwear:
  camera_index: 1
  model_path: models/footwear/footwear_policy_yolo11n.pt
  confidence_threshold: 0.25
  allowed_labels:
    - shoe
    - footwear
  flagged_labels:
    - sandal

attendance:
  duplicate_cooldown_minutes: 30
  session_name: default
